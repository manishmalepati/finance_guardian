cases:
  - id: monthly_summary_default
    query: "How did my spending look by month?"
    expected_tool: get_monthly_summary
    must_include:
      - "monthly"
  - id: category_spend
    query: "How much did I spend by category?"
    expected_tool: get_spending_by_category
    must_include:
      - "category"
  - id: largest_transactions
    query: "What are my biggest transactions?"
    expected_tool: get_largest_transactions
    must_include:
      - "largest"
  - id: merchant_search
    query: "Find my Starbucks transactions."
    expected_tool: search_transactions
    must_include:
      - "Starbucks"
  - id: grocery_category
    query: "How much did I spend on groceries?"
    expected_tool: get_spending_by_category
    must_include:
      - "groceries"
  - id: month_over_month
    query: "Did my spending change across months?"
    expected_tool: get_monthly_summary
    must_include:
      - "month"
  - id: restaurant_category
    query: "Show my food and restaurant spending."
    expected_tool: get_spending_by_category
    must_include:
      - "restaurant"
