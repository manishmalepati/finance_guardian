services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_guardian}
      POSTGRES_DB: ${POSTGRES_DB:-finance_guardian}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_guardian} -d ${POSTGRES_DB:-finance_guardian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://finance_guardian:finance_guardian@postgres:5432/finance_guardian}
      PYTHONPATH: /app
      POSTGRES_USER: ${POSTGRES_USER:-finance_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_guardian}
      POSTGRES_DB: ${POSTGRES_DB:-finance_guardian}
      DBT_PROFILES_DIR: /app/dbt
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app/backend
      - ./dbt:/app/dbt
      - ./evals:/app/evals
      - ./.local:/app/.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
