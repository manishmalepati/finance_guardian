services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_guardian}
      POSTGRES_DB: ${POSTGRES_DB:-finance_guardian}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_guardian} -d ${POSTGRES_DB:-finance_guardian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://finance_guardian:finance_guardian@postgres:5432/finance_guardian}
      PYTHONPATH: /app
      POSTGRES_USER: ${POSTGRES_USER:-finance_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_guardian}
      POSTGRES_DB: ${POSTGRES_DB:-finance_guardian}
      DBT_PROFILES_DIR: /app/dbt
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      FINANCE_LLM_PRIVACY: ${FINANCE_LLM_PRIVACY:-local_only}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_PRODUCTS: ${PLAID_PRODUCTS:-transactions}
      PLAID_COUNTRY_CODES: ${PLAID_COUNTRY_CODES:-US}
      PLAID_CLIENT_NAME: ${PLAID_CLIENT_NAME:-Finance Guardian}
      PLAID_VAULT_KEY: ${PLAID_VAULT_KEY:-}
      PLAID_VAULT_PATH: ${PLAID_VAULT_PATH:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8000/gmail/callback}
      GMAIL_TOKEN_KEY: ${GMAIL_TOKEN_KEY:-}
    volumes:
      - ./backend:/app/backend
      - ./dbt:/app/dbt
      - ./evals:/app/evals
      - ./.local:/app/.local
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
