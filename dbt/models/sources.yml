version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: ingestion_runs
      - name: plaid_items
      - name: plaid_sync_runs
      - name: plaid_transactions
      - name: statement_documents
      - name: statement_transactions
  - name: core
    schema: core
    tables:
      - name: financial_accounts
      - name: transactions
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: posted_date
            tests:
              - not_null
          - name: direction
            tests:
              - accepted_values:
                  arguments:
                    values: ["credit", "debit"]
          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ["active", "pending", "removed", "superseded"]
  - name: enrichment
    schema: enrichment
    tables:
      - name: category_taxonomy
      - name: plaid_category_mappings
      - name: transaction_categorizations
