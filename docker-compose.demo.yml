name: finance_guardian_demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finance_guardian_demo
      POSTGRES_PASSWORD: finance_guardian_demo
      POSTGRES_DB: finance_guardian_demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_guardian_demo -d finance_guardian_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finance_guardian_demo:finance_guardian_demo@postgres:5432/finance_guardian_demo
      PYTHONPATH: /app
      DEMO_MODE: "true"
      DBT_PROFILES_DIR: /app/dbt
    volumes:
      - ./backend:/app/backend
      - ./dbt:/app/dbt
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8100
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_demo_data:
